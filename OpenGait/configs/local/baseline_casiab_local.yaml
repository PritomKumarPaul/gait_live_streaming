data_cfg:
  dataset_name: CASIA-B
  dataset_root: /home/ppaul11/All-in-One-Gait/casiab-pkl
  dataset_partition: /home/ppaul11/All-in-One-Gait/OpenGait/datasets/CASIA-B/CASIA-B.json
  num_workers: 4
  cache: false
  remove_no_gallery: false
  test_dataset_name: CASIA-B

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 10000
  save_name: Baseline
  eval_func: evaluate_indoor_dataset
  sampler:
    batch_shuffle: false
    batch_size: 16
    sample_type: all_ordered
    type: InferenceSampler
    frames_all_limit: 720
  metric: euc
  transform:
    - type: BaseSilCuttingTransform
      img_w: 64
  cross_view_gallery: false

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 0.1
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: Baseline
  backbone_cfg:
    in_channels: 1
    layers_cfg:
      - BC-64
      - BC-64
      - M
      - BC-128
      - BC-128
      - M
      - BC-256
      - BC-256
    type: Plain
  SeparateFCs:
    in_channels: 256
    out_channels: 256
    parts_num: 31
  SeparateBNNecks:
    class_num: 73
    in_channels: 256
    parts_num: 31
  bin_num:
    - 16
    - 8
    - 4
    - 2
    - 1

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones:
    - 20000
    - 40000
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true
  fix_BN: false
  log_iter: 100
  with_test: true
  restore_ckpt_strict: true
  optimizer_reset: false
  scheduler_reset: false
  restore_hint: 0
  save_iter: 10000
  save_name: Baseline
  sync_BN: false
  total_iter: 10000
  sampler:
    batch_shuffle: true
    batch_size:
      - 8
      - 16
    frames_num_fixed: 30
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_unordered
    type: TripletSampler
  transform:
    - type: BaseSilCuttingTransform
      img_w: 64
